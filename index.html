<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iVendas — Gestão de vendas de iPhone</title>
<style>
  :root{
    --bg:#f2f2f5; --surface:#ffffff; --surface-2:#fafafc;
    --ink:#1d1d1f; --muted:#86868b; --line:#e4e4e9;
    --blue:#0a84ff; --blue-soft:#eaf3ff;
    --green:#22a45d; --green-soft:#e6f6ec;
    --red:#e5342b; --red-soft:#fdeceb;
    --amber:#c98a00; --amber-soft:#fdf3dd;
    --radius:16px; --radius-sm:11px;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; padding-bottom:84px;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* Header */
  header{
    position:sticky; top:0; z-index:20; background:rgba(242,242,245,.8);
    backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
    padding:14px 18px 10px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:1.22rem; letter-spacing:-.02em;}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;}
  .icon-btn{border:none;background:var(--surface);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow);}

  main{max-width:720px; margin:0 auto; padding:16px 14px 24px;}

  /* Cards / sections */
  .card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .card + .card{margin-top:14px;}
  .card-pad{padding:16px;}

  .section-title{font-size:.8rem; color:var(--muted); font-weight:600; margin:22px 4px 9px; letter-spacing:.01em;}
  .section-title:first-child{margin-top:4px;}

  /* Stat grid */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{background:var(--surface); border-radius:var(--radius); padding:15px 16px; box-shadow:var(--shadow);}
  .stat .lbl{font-size:.78rem; color:var(--muted); font-weight:500;}
  .stat .val{font-size:1.5rem; font-weight:700; letter-spacing:-.02em; margin-top:3px;}
  .stat.big{grid-column:1 / -1;}
  .stat .val.green{color:var(--green);} .stat .val.red{color:var(--red);} .stat .val.blue{color:var(--blue);}

  /* List rows */
  .row{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface);}
  .row:last-child{border-bottom:none;}
  .row:active{background:var(--surface-2);}
  .row .grow{flex:1; min-width:0;}
  .row .title{font-weight:600; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .sub{font-size:.83rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .amt{font-weight:700; white-space:nowrap;}
  .avatar{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex-shrink:0;}
  .chev{color:#c4c4cc; font-size:20px;}

  .empty{padding:40px 20px; text-align:center; color:var(--muted);}
  .empty .big{font-size:2.4rem; margin-bottom:8px;}

  /* Badges */
  .badge{display:inline-block; font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:20px;}
  .b-green{background:var(--green-soft); color:var(--green);}
  .b-red{background:var(--red-soft); color:var(--red);}
  .b-amber{background:var(--amber-soft); color:var(--amber);}
  .b-blue{background:var(--blue-soft); color:var(--blue);}
  .b-gray{background:#eee; color:var(--muted);}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:12px; padding:13px 16px; font-size:1rem; font-weight:600; background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .btn.block{width:100%;}
  .btn.primary{background:var(--ink); color:#fff; box-shadow:none;}
  .btn.blue{background:var(--blue); color:#fff; box-shadow:none;}
  .btn.green{background:var(--green); color:#fff; box-shadow:none;}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--blue);}
  .btn.sm{padding:9px 12px; font-size:.9rem; border-radius:10px;}
  .btn:active{transform:scale(.98);}
  .btn.danger{color:var(--red);}

  .fab-note{color:var(--muted); font-size:.8rem; text-align:center; margin-top:14px;}

  /* Forms */
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin:0 2px 6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:11px;
    background:var(--surface); color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
  .field textarea{resize:vertical; min-height:64px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px;}

  /* Modal / sheet */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:50; display:none; opacity:0; transition:opacity .18s ease;}
  .overlay.show{display:block; opacity:1;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--bg);
    border-radius:22px 22px 0 0; max-height:94vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.show{transform:translateY(0);}
  .sheet-head{position:sticky; top:0; z-index:2; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px;}
  .sheet-head h2{font-size:1.2rem; letter-spacing:-.02em;}
  .sheet-body{padding:0 14px;}
  .close-x{border:none; background:#e6e6ec; width:32px;height:32px;border-radius:50%; font-size:16px; color:#555; display:grid; place-items:center;}
  .max{max-width:720px; margin:0 auto;}

  /* Parcela row */
  .parc{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .parc:last-child{border-bottom:none;}
  .parc .n{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0;border:1px solid var(--line);}
  .parc.pago .n{background:var(--green-soft); color:var(--green); border-color:transparent;}

  /* Receipt */
  .receipt{background:#fff; border-radius:16px; padding:22px; box-shadow:var(--shadow); font-size:.92rem;}
  .receipt h3{font-size:1.15rem; letter-spacing:-.02em;}
  .receipt .r-line{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line);}
  .receipt .r-line span:first-child{color:var(--muted);}
  .receipt .r-total{display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; padding-top:10px;}

  .attach-prev{margin-top:8px;}
  .attach-prev img{width:100%; border-radius:12px; border:1px solid var(--line); display:block;}

  /* Tab bar */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{flex:1; border:none; background:transparent; padding:6px 0 5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.68rem; font-weight:600;}
  nav button .ic{font-size:21px; line-height:1;}
  nav button.active{color:var(--blue);}

  .hidden{display:none !important;}
  .mt{margin-top:12px;} .mt-s{margin-top:8px;}
  .center{text-align:center;}
  .link{color:var(--blue); font-weight:600; background:none; border:none; padding:0; font-size:inherit;}
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:14px; font-size:.9rem; font-weight:600; z-index:99; opacity:0; transition:.25s; pointer-events:none; box-shadow:var(--shadow);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media(min-width:560px){ .brand{font-size:1.3rem;} }

  /* Simulador / Estoque */
  .check{display:flex; align-items:center; gap:9px; font-size:.92rem; padding:4px 2px;}
  .check input{width:20px; height:20px; accent-color:var(--blue);}
  .msg-area{width:100%; min-height:260px; padding:12px 13px; border:1px solid var(--line); border-radius:11px; background:var(--surface-2); color:var(--ink); font-size:.9rem; line-height:1.5; resize:vertical; outline:none;}
  .msg-area:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}
  .btn-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .stat .val.sm{font-size:1.2rem;}
  .stat .hint{font-size:.74rem; color:var(--muted); margin-top:2px;}
  .tbl-wrap{overflow-x:auto;}
  .tbl{width:100%; border-collapse:collapse; font-size:.86rem; font-variant-numeric:tabular-nums;}
  .tbl th{font-size:.72rem; color:var(--muted); font-weight:600; text-align:right; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  .tbl td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl th:first-child,.tbl td:first-child{text-align:left;}
  .tbl td.nm{white-space:normal; min-width:150px; font-weight:600;}
  details.card summary{padding:14px 16px; font-weight:600; cursor:pointer; list-style:none; display:flex; justify-content:space-between;}
  details.card summary::after{content:'›'; color:#c4c4cc; font-size:20px; line-height:1; transition:transform .2s;}
  details.card[open] summary::after{transform:rotate(90deg);}
  details.card summary::-webkit-details-marker{display:none;}
  .grid2 > *, .grid3 > *{min-width:0;}

  .logged-out header .icon-btn, .logged-out nav{ display:none; }
  .login-wrap{ min-height:72vh; display:grid; place-items:center; padding:20px; }
  .login-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 22px; width:100%; max-width:360px; }

  @media print{
    header,nav,.overlay,.sheet-head,.no-print{display:none !important;}
    body{background:#fff; padding:0;}
    .sheet{position:static; transform:none; max-height:none; background:#fff;}
    .receipt{box-shadow:none; border:1px solid #ddd;}
    /* imprime/salva PDF só o recibo, no topo da página */
    body *{visibility:hidden;}
    #reciboPrint, #reciboPrint *{visibility:visible;}
    #reciboPrint{position:absolute; left:0; top:0; width:100%; margin:0; border-radius:0;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot">📱</span> iVendas</div>
  <button class="icon-btn" onclick="openConfig()" aria-label="Configurações">⚙️</button>
</header>

<main id="app"></main>

<nav>
  <button id="tab-inicio" class="active" onclick="go('inicio')"><span class="ic">🏠</span>Início</button>
  <button id="tab-vendas" onclick="go('vendas')"><span class="ic">🧾</span>Vendas</button>
  <button id="tab-clientes" onclick="go('clientes')"><span class="ic">👥</span>Clientes</button>
  <button id="tab-simular" onclick="go('simular')"><span class="ic">🧮</span>Simular</button>
  <button id="tab-estoque" onclick="go('estoque')"><span class="ic">📦</span>Estoque</button>
</nav>

<!-- Overlay + Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head max">
    <h2 id="sheetTitle">Título</h2>
    <button class="close-x" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-body max" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================ DADOS + LOGIN ============================ */
/* Banco online: Supabase (tabela ivendas_kv), protegido por login.
   Só quem tem conta lê/grava. Guarda cache local pra funcionar offline. */
const SUPABASE_URL = 'https://xmzhvhoxwoswkytlodjk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hetdVT6470_74NaJVyTulA_d2wiE4_j';
const SB_TABLE = 'ivendas_kv';
const CACHE = 'ivendas_';
const SESSION_KEY = 'ivendas_session';

let session = null;
function loadSession(){ try{ session = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ session=null; } }
function saveSession(j){ session = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now()+((j.expires_in||3600)*1000) }; try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){} }
function clearSession(){ session=null; try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function sbLogin(email, password){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email:(email||'').trim().toLowerCase(), password })
  });
  if(!r.ok) return false;
  saveSession(await r.json()); return true;
}
async function sbRefresh(){
  if(!session || !session.refresh_token) return false;
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  if(!r.ok){ clearSession(); return false; }
  saveSession(await r.json()); return true;
}
function authHeaders(){
  return { apikey:SUPABASE_KEY, 'Authorization':'Bearer '+(session ? session.access_token : SUPABASE_KEY), 'Content-Type':'application/json' };
}
async function sbFetch(path, opts={}, retry=true){
  const r = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers:{ ...authHeaders(), ...(opts.headers||{}) } });
  if(r.status===401 && retry){ if(await sbRefresh()) return sbFetch(path, opts, false); }
  return r;
}

const Store = {
  _warned:false,
  async get(key){
    try{
      const r = await sbFetch(`/rest/v1/${SB_TABLE}?key=eq.${encodeURIComponent(key)}&select=data`);
      if(!r.ok) throw new Error('http '+r.status);
      const j = await r.json();
      const val = j[0] ? j[0].data : null;
      try{ localStorage.setItem(CACHE+key, JSON.stringify(val)); }catch(e){}
      return val;
    }catch(e){
      try{ const v = localStorage.getItem(CACHE+key); return v ? JSON.parse(v) : null; }catch(_){ return null; }
    }
  },
  async set(key,val){
    try{ localStorage.setItem(CACHE+key, JSON.stringify(val)); }catch(e){}
    try{
      const r = await sbFetch(`/rest/v1/${SB_TABLE}`, {
        method:'POST',
        headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({ key, data:val })
      });
      if(!r.ok) throw new Error('http '+r.status);
      return true;
    }catch(e){
      if(!Store._warned){ Store._warned=true; try{ toast('Sem conexão — salvo no aparelho'); }catch(_){}}
      return false;
    }
  },
  async del(key){
    try{ localStorage.removeItem(CACHE+key); }catch(e){}
    try{ await sbFetch(`/rest/v1/${SB_TABLE}?key=eq.${encodeURIComponent(key)}`, { method:'DELETE' }); }catch(e){}
  }
};

let db = { config:{}, clientes:[], vendas:[] };
let view = 'inicio';

async function load(){
  db.config   = (await Store.get('config'))   || { vendedor:'', telefone:'', pixChave:'03709746035', pixTipo:'CPF/CNPJ', pixNome:'', pixBanco:'', cidade:'', emailRelatorio:'Matheus@msxinv.com.br' };
  db.clientes = (await Store.get('clientes')) || [];
  db.vendas   = (await Store.get('vendas'))   || [];
  db.listaForn = (await Store.get('listaFornecedor')) || '';
}
const saveClientes = ()=> Store.set('clientes', db.clientes);
const saveVendas   = ()=> Store.set('vendas', db.vendas);
const saveConfig   = ()=> Store.set('config', db.config);

/* ============================ HELPERS ============================ */
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const onlyDigits = s => (s||'').replace(/\D/g,'');
const esc = s => (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = ()=> new Date().toISOString().slice(0,10);

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`;
}
function addMonthsISO(iso, months){
  const [y,m,d] = iso.split('-').map(Number);
  const base = new Date(y, m-1+months, d);
  // corrige overflow (ex: 31 -> mês sem 31)
  if(base.getDate() !== d) base.setDate(0);
  return base.toISOString().slice(0,10);
}
function daysDiff(iso){ // dias a partir de hoje (negativo = venceu)
  const t = new Date(todayISO()+'T00:00:00'); const d = new Date(iso+'T00:00:00');
  return Math.round((d - t)/86400000);
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function initials(nome){ return (nome||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

// nome do cliente por id
const clienteById = id => db.clientes.find(c=>c.id===id);
// valor total de parcelas em aberto de uma venda
function abertoVenda(v){ return v.parcelas.filter(p=>!p.pago).reduce((s,p)=>s+Number(p.valor),0); }
function recebidoVenda(v){ return Number(v.entrada||0) + v.parcelas.filter(p=>p.pago).reduce((s,p)=>s+Number(p.valor),0); }
function custosVenda(v){ return Number(v.custoCompra||0)+Number(v.custoMotoboy||0)+Number(v.custoAcessorios||0)+Number(v.custoOutros||0); }
function lucroVenda(v){ return Number(v.valorTotal||0) - custosVenda(v); }

/* ---- PIX Copia e Cola (BR Code / EMV) ---- */
function pixSanitize(s,max){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').trim().slice(0,max); }
function pixTLV(id,val){ return id + String(val.length).padStart(2,'0') + val; }
function pixCRC16(str){ let c=0xFFFF; for(let i=0;i<str.length;i++){ c^=str.charCodeAt(i)<<8; for(let j=0;j<8;j++){ c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } } return c.toString(16).toUpperCase().padStart(4,'0'); }
function pixCopiaCola(valor){
  const cfg=db.config;
  if(!cfg.pixChave) return '';
  const chave = cfg.pixChave.trim();
  const nome = pixSanitize(cfg.pixNome||cfg.vendedor||'RECEBEDOR PIX',25) || 'RECEBEDOR PIX';
  const cidade = pixSanitize(cfg.cidade||'BRASIL',15) || 'BRASIL';
  const mai = pixTLV('00','br.gov.bcb.pix') + pixTLV('01',chave);
  let p = pixTLV('00','01') + pixTLV('01','11') + pixTLV('26',mai) + pixTLV('52','0000') + pixTLV('53','986');
  if(valor && Number(valor)>0) p += pixTLV('54', Number(valor).toFixed(2));
  p += pixTLV('58','BR') + pixTLV('59',nome) + pixTLV('60',cidade) + pixTLV('62', pixTLV('05','***'));
  p += '6304'; return p + pixCRC16(p);
}

/* ============================ NAVEGAÇÃO ============================ */
function go(v){
  view = v;
  ['inicio','vendas','clientes','simular','estoque'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===v);
  });
  render();
}
function render(){
  const app = document.getElementById('app');
  if(view==='inicio')   app.innerHTML = viewInicio();
  if(view==='vendas')   app.innerHTML = viewVendas();
  if(view==='clientes') app.innerHTML = viewClientes();
  if(view==='simular'){ app.innerHTML = viewSimular(); calcSim(); }
  if(view==='estoque'){ app.innerHTML = viewEstoque(); calcEst(); }
  window.scrollTo(0,0);
}

/* ============================ PRECIFICAÇÃO (compartilhada) ============================ */
function P(){
  if(!db.config.preco) db.config.preco = { moto:40, brinde:60, margem:18, modo:'custo', arred:10, juros:5, parcelas:12, v:3 };
  if(!db.config.preco.v){ db.config.preco.arred = 10; db.config.preco.v = 2; } // padrão: arredondar para a dezena
  if(db.config.preco.v < 3){ db.config.preco.juros = 5; db.config.preco.v = 3; } // padrão: 5% a.m.
  return db.config.preco;
}
const num = id => Number(document.getElementById(id)?.value||0);
function lerPreco(){
  const p = P();
  p.moto = num('pMoto'); p.brinde = num('pBrinde'); p.margem = num('pMargem');
  p.modo = document.getElementById('pModo').value; p.arred = Number(document.getElementById('pArred').value)||1;
  clearTimeout(lerPreco._t); lerPreco._t = setTimeout(saveConfig, 800);
}
function precoVenda(custoProduto){
  const p = P();
  const custo = Number(custoProduto||0) + Number(p.moto||0) + Number(p.brinde||0);
  const m = Number(p.margem||0)/100;
  const base = p.modo==='venda' ? (m<1 ? custo/(1-m) : custo) : custo*(1+m);
  const mult = Number(p.arred)||1;
  return { custo, venda: Math.ceil(base/mult - 1e-9)*mult };
}
function pmtPrice(pv, i, n){ return i>0 ? pv*i/(1-Math.pow(1+i,-n)) : pv/n; }

function calcSim(){
  if(!document.getElementById('sCusto')) return null;
  const v = id => document.getElementById(id).value;
  Object.assign(sim, { produto:v('sProd'), custo:v('sCusto'), entrada:v('sEnt'), n:v('sN'), juros:v('sJ'), venc:v('sVenc'),
    forma:v('sForma'), validade:v('sVal'), clienteId:v('sCli'), arredParc:document.getElementById('sArr').checked, crono:document.getElementById('sCrono').checked });
  const { custo, venda } = precoVenda(sim.custo);
  const ent = Number(sim.entrada||0), n = Math.max(1, Math.round(Number(sim.n)||1)), i = Number(sim.juros||0)/100;
  const pv = Math.max(0, venda-ent);
  let pmt = pmtPrice(pv, i, n); if(sim.arredParc) pmt = Math.ceil(pmt - 1e-9);
  const total = pmt*n + ent;
  const venc1 = sim.venc || addMonthsISO(todayISO(),1);
  let saldo = pv, rows = '', datas = [];
  for(let k=1;k<=n;k++){
    const j = saldo*i; saldo = Math.max(0, saldo-(pmt-j));
    const d = addMonthsISO(venc1, k-1); datas.push(d);
    rows += `<tr><td>${k}</td><td>${fmtDate(d)}</td><td>${money(pmt)}</td><td>${money(j)}</td><td>${money(saldo)}</td></tr>`;
  }
  const pct = (a,b)=> b>0 ? (a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%' : '';
  const set = (id,t)=>{ document.getElementById(id).textContent = t; };
  const temCusto = Number(sim.custo)>0;
  set('oVista', temCusto?money(venda):'–'); set('oParc', temCusto?money(pmt):'–'); set('oParcHint', temCusto?`${n}x · ${(i*100).toLocaleString('pt-BR')}% a.m.`:'Informe o custo do aparelho');
  set('oTotal', temCusto?money(total):'–'); set('oCusto', temCusto?money(custo):'–');
  set('oLV', temCusto?money(venda-custo):'–'); set('oLVh', temCusto?pct(venda-custo,custo)+' sobre o custo':'');
  set('oLP', temCusto?money(total-custo):'–'); set('oLPh', temCusto?pct(total-custo,custo)+' com os juros':'');
  document.getElementById('oTb').innerHTML = temCusto ? rows : '';

  const c = clienteById(sim.clienteId), cfg = db.config, prod = sim.produto.trim() || 'iPhone', val = Number(sim.validade)||3;
  let t = `Olá${c?', '+c.nome.split(' ')[0]:''}! Tudo bem?\n\nSegue a proposta para o *${prod}*:\n\n`;
  t += `*Valor à vista:* ${money(venda)}\n`;
  if(ent>0) t += `*Entrada:* ${money(ent)}\n`;
  t += `*Parcelamento:* ${n}x de *${money(pmt)}*\n`;
  t += `*Taxa de juros:* ${(i*100).toLocaleString('pt-BR',{maximumFractionDigits:2})}% ao mês (Tabela Price)\n`;
  t += `*Forma de pagamento:* ${sim.forma}\n`;
  t += `*1º vencimento:* ${fmtDate(datas[0])}${n>1?` | *Último:* ${fmtDate(datas[n-1])}`:''}\n`;
  if(sim.crono) t += `\n*Cronograma:*\n` + datas.map((d,k)=>`${String(k+1).padStart(2,'0')}) ${fmtDate(d)} - ${money(pmt)}`).join('\n') + '\n';
  t += `\nCaso queira quitar antecipadamente, os juros das parcelas restantes são descontados.\n\nProposta válida por ${val} dia${val>1?'s':''}. Qualquer dúvida, estou à disposição!\n\n${cfg.vendedor?'Abraço,\n'+cfg.vendedor:'Abraço!'}`;
  document.getElementById('sMsg').value = temCusto ? t : '';
  return { custo, venda, ent, n, pmt, total, venc1 };
}

function calcEst(){
  const inp = document.getElementById('eIn'); if(!inp) return;
  document.getElementById('eParcBox').classList.toggle('hidden', !estParc);
  const n = Math.max(1, Math.round(num('eN')||1)), i = num('eJ')/100;
  const fmtR = v => 'R$' + v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  const re = /R\$\s*(\d[\d.]*(?:,\d{1,2})?)/g;
  let nome = '', itens = [], out = [];
  for(const line of inp.value.split('\n')){
    if(!/R\$/.test(line)){
      const limpo = line.replace(/\*/g,'').trim();
      if(limpo && !/^[⁠​•☑✅️-]/.test(limpo) && !/^lista/i.test(limpo)) nome = limpo;
      out.push(line); continue;
    }
    out.push(line.replace(re, (_, nmr)=>{
      const c = parseFloat(nmr.replace(/\./g,'').replace(',','.'));
      const r = precoVenda(c);
      itens.push({ nome, c, custo:r.custo, v:r.venda });
      return fmtR(r.venda);
    }));
    if(estParc && itens.length){
      const v = itens[itens.length-1].v;
      out.push(`   ou ${n}x de ${fmtR(Math.ceil(pmtPrice(v,i,n)-1e-9))}`);
    }
  }
  document.getElementById('eOut').value = out.join('\n');
  document.getElementById('eTit').textContent = itens.length ? `Conferência de lucro (${itens.length} preços)` : 'Conferência de lucro';
  document.getElementById('eTb').innerHTML = itens.length
    ? itens.map(x=>`<tr><td class="nm">${esc(x.nome)}</td><td>${money(x.c)}</td><td>${money(x.v)}</td><td style="color:var(--green);font-weight:600">${money(x.v-x.custo)}</td></tr>`).join('')
    : `<tr><td colspan="4" class="nm" style="color:var(--muted);font-weight:400">Cole a lista do fornecedor acima. Os preços precisam estar no formato R$1990,00.</td></tr>`;
}

        <div style="text-align:right"><div class="amt">${money(r.total)}</div><div style="font-size:.78rem;color:var(--green);font-weight:600">+${money(r.lucro)}</div></div>
      </div>`;
    });
    html += `</div><div class="section-title">Todos os clientes</div>`;
  }

  const ord = [...db.clientes].sort((a,b)=>a.nome.localeCompare(b.nome));
  html += `<div class="card ${rank.length?'':'mt'}">`;
  ord.forEach(c=>{
    const nVendas = db.vendas.filter(v=>v.clienteId===c.id).length;
    html += `<div class="row" onclick="editarCliente('${c.id}')">
      <div class="avatar">${esc(initials(c.nome))}</div>
      <div class="grow">
        <div class="title">${esc(c.nome)}</div>
        <div class="sub">${esc(c.telefone||'sem telefone')}${nVendas?` · ${nVendas} venda(s)`:''}</div>
      </div>
      <span class="chev">›</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function recalcParc(){
  const total = Number(document.getElementById('vTotal')?.value||0);
  const entrada = Number(document.getElementById('vEntrada')?.value||0);
  const n = parseInt(document.getElementById('vNParc')?.value||0);
  const venc1 = document.getElementById('vVenc1')?.value || addMonthsISO(todayISO(),1);
  const box = document.getElementById('parcPreview');
  if(!box) return;
  if(!n || n<1){ box.innerHTML = `<p class="sub" style="color:var(--muted)">Sem parcelas (à vista).</p>`; return; }
  const financiar = Math.max(0, total - entrada);
  const base = Math.floor((financiar/n)*100)/100;
  let resto = Math.round((financiar - base*n)*100)/100;
  let html = `<div class="card" style="box-shadow:none;border:1px solid var(--line)">`;
  for(let i=0;i<n;i++){
    let val = base + (i===n-1 ? resto : 0);
    html += `<div class="parc"><div class="n">${i+1}</div>
      <div class="grow"><div class="title" style="font-size:.92rem">${money(val)}</div>
      <div class="sub">vence ${fmtDate(addMonthsISO(venc1,i))}</div></div></div>`;
  }
  html += `</div>`;
  box.innerHTML = html;
}

function recalcLucro(){
  const total=Number(document.getElementById('vTotal')?.value||0);
  const custos=['vCusto','vMoto','vAcess','vOutros'].reduce((s,id)=>s+Number(document.getElementById(id)?.value||0),0);
  const box=document.getElementById('lucroPreview'); if(!box) return;
  const lucro=total-custos; const marg= total>0? (lucro/total*100):0;
  const cor = lucro>=0?'var(--green)':'var(--red)';
  box.innerHTML=`<div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center">
    <span style="color:var(--muted);font-size:.92rem">Lucro estimado</span>
    <span style="font-weight:700;font-size:1.2rem;color:${cor}">${money(lucro)} <span style="font-size:.8rem;font-weight:600">(${marg.toFixed(0)}%)</span></span></div>`;
}

async function preFornecedor(inp){
  const f = inp.files[0]; if(!f) return;
  const img = await compressImage(f);
  _fornecedorImg = img;
  document.getElementById('fornecedorPrev').innerHTML = `<img src="${img}"><button class="link mt-s" onclick="removerFornecedor()">Remover anexo</button>`;
}
function removerFornecedor(){
  _fornecedorImg = null;
  const inp = document.getElementById('vRecibo'); if(inp) inp.value='';
  document.getElementById('fornecedorPrev').innerHTML = '';
}
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 1200;
        let {width:w, height:h} = img;
        if(w>max || h>max){ const r = Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = ()=>resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function salvarVenda(id){
  const clienteId = document.getElementById('vCliente').value;
  const total = Number(document.getElementById('vTotal').value||0);
  const modelo = document.getElementById('vModelo').value.trim();
  if(!clienteId){ toast('Selecione o comprador'); return; }
  if(!modelo){ toast('Informe o modelo'); return; }
  if(!total){ toast('Informe o valor total'); return; }

  const entrada = Number(document.getElementById('vEntrada').value||0);
  const n = parseInt(document.getElementById('vNParc').value||0);
  const venc1 = document.getElementById('vVenc1').value || addMonthsISO(todayISO(),1);
  const data = document.getElementById('vData').value || todayISO();

  // parcelas
  let parcelas = [];
  if(n>=1){
    const financiar = Math.max(0, total-entrada);
    const base = Math.floor((financiar/n)*100)/100;
    const resto = Math.round((financiar - base*n)*100)/100;
    for(let i=0;i<n;i++){
      parcelas.push({ numero:i+1, total:n, valor:+(base+(i===n-1?resto:0)).toFixed(2),
                      vencimento:addMonthsISO(venc1,i), pago:false, dataPagamento:null });
    }
  }

  const dados = {
    clienteId, data,
    modelo, capacidade:document.getElementById('vCap').value, cor:document.getElementById('vCor').value.trim(),
    condicao:document.getElementById('vCond').value, bateria:document.getElementById('vBat').value.trim(),
    imei:document.getElementById('vImei').value.trim(), caract:document.getElementById('vCaract').value.trim(),
    valorTotal:total, entrada, parcelas,
    custoCompra:Number(document.getElementById('vCusto').value||0),
    custoMotoboy:Number(document.getElementById('vMoto').value||0),
    custoAcessorios:Number(document.getElementById('vAcess').value||0),
    custoOutros:Number(document.getElementById('vOutros').value||0)
  };

  let vid = id;
  if(id){
    const v = db.vendas.find(x=>x.id===id);
    // mantém status de pagamento das parcelas se o nº bater
    if(v.parcelas.length===parcelas.length){
      parcelas.forEach((p,i)=>{ p.pago=v.parcelas[i].pago; p.dataPagamento=v.parcelas[i].dataPagamento; });
    }
    Object.assign(v, dados);
  } else {
    vid = uid(); db.vendas.push({ id:vid, ...dados });
  }

  // recibo do fornecedor em chave separada
  if(_fornecedorImg){ await Store.set('recibo_'+vid, _fornecedorImg); }
  else { await Store.del('recibo_'+vid); }

  await saveVendas(); closeSheet(); toast('Venda registrada ✅');
  go('vendas');
  setTimeout(()=>abrirVenda(vid), 120);
}

function baixarParcela(vid, num){
  const v = db.vendas.find(x=>x.id===vid);
  const p = v.parcelas.find(x=>x.numero===num);
  p.pago = true; p.dataPagamento = todayISO();
  saveVendas(); toast(`Parcela ${num} baixada ✅`); abrirVenda(vid);
}
function estornarParcela(vid, num){
  const v = db.vendas.find(x=>x.id===vid);
  const p = v.parcelas.find(x=>x.numero===num);
  p.pago = false; p.dataPagamento = null;
  saveVendas(); toast('Baixa estornada'); abrirVenda(vid);
}
async function excluirVenda(id){
  if(!confirm('Excluir esta venda? Não dá pra desfazer.')) return;
  db.vendas = db.vendas.filter(v=>v.id!==id);
  await Store.del('recibo_'+id);
  await saveVendas(); closeSheet(); go('vendas'); toast('Venda excluída');
}

/* ============================ WHATSAPP: cobrança ============================ */
function waLink(phone, text){
  let d = onlyDigits(phone);
  if(!d.startsWith('55')) d = '55'+d;
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}
function cobrarWhats(vid, num){
  const v = db.vendas.find(x=>x.id===vid);
  const c = clienteById(v.clienteId);
  const p = v.parcelas.find(x=>x.numero===num);
  if(!c || !c.telefone){ toast('Cliente sem WhatsApp cadastrado'); return; }
  const cfg = db.config;
  const dias = daysDiff(p.vencimento);
  const situacao = dias<0 ? `venceu em ${fmtDate(p.vencimento)}` : dias===0 ? `vence hoje (${fmtDate(p.vencimento)})` : `vence em ${fmtDate(p.vencimento)}`;

  const copia = pixCopiaCola(p.valor);
  let pixBlock = cfg.pixChave
    ? `\n💳 *Pagamento via PIX:*\n🔑 ${cfg.pixTipo}: ${cfg.pixChave}${cfg.pixNome?`\n👤 ${cfg.pixNome}`:''}${cfg.pixBanco?`\n🏦 ${cfg.pixBanco}`:''}\n${copia?`\n📋 *PIX Copia e Cola* (é só colar no app do banco):\n${copia}\n`:''}`
    : '';

  const msg =
`Olá ${c.nome.split(' ')[0]}! 👋

Passando pra lembrar da parcela do seu iPhone ${v.modelo||''}.

📅 Parcela ${p.numero}/${p.total} — ${situacao}
💰 Valor: ${money(p.valor)}
${pixBlock}
Assim que fizer o PIX, me manda o comprovante 🙏
Qualquer coisa é só chamar!${cfg.vendedor?`\n\n${cfg.vendedor}`:''}`;

  window.open(waLink(c.telefone, msg), '_blank');
}

/* ============================ RELATÓRIO MENSAL ============================ */
function mesLabel(ym){
  const [y,m]=ym.split('-');
  const nomes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${nomes[+m-1]} de ${y}`;
}
function relatorioMes(ym){
  const vendas = db.vendas.filter(v => (v.data||'').startsWith(ym));
  const totalVendido = vendas.reduce((s,v)=>s+Number(v.valorTotal||0),0);
  const custos = vendas.reduce((s,v)=>s+custosVenda(v),0);
  const lucro = vendas.reduce((s,v)=>s+lucroVenda(v),0);
  const entradas = vendas.reduce((s,v)=>s+Number(v.entrada||0),0);
  let parcPagas=0, aVencer=0, vencidas=0;
  db.vendas.forEach(v=>v.parcelas.forEach(p=>{
    if(p.pago && (p.dataPagamento||'').startsWith(ym)) parcPagas+=Number(p.valor);
    if(!p.pago && (p.vencimento||'').startsWith(ym)){ if(daysDiff(p.vencimento)<0) vencidas+=Number(p.valor); else aVencer+=Number(p.valor); }
  }));
  return { vendas, totalVendido, custos, lucro, recebido:entradas+parcPagas, aVencer, vencidas };
}
function openRelatorio(ym){
  ym = ym || todayISO().slice(0,7);
  const r = relatorioMes(ym);
  const linhas = r.vendas.length
    ? r.vendas.map(v=>{ const c=clienteById(v.clienteId);
        return `<div class="row"><div class="avatar">📱</div><div class="grow">
          <div class="title" style="font-size:.92rem">iPhone ${esc(v.modelo||'')} — ${esc(c?c.nome:'')}</div>
          <div class="sub">${money(v.valorTotal)} · lucro ${money(lucroVenda(v))}</div></div></div>`; }).join('')
    : `<div class="empty">Nenhuma venda neste mês.</div>`;
  const body = `
    <div class="card card-pad">
      <div class="field" style="margin-bottom:0"><label>Mês</label><input type="month" value="${ym}" onchange="openRelatorio(this.value)"></div>
    </div>
    <div class="card card-pad mt">
      <div class="center" style="color:var(--muted);font-size:.85rem;margin-bottom:8px">${mesLabel(ym)}</div>
      <div class="r-line"><span>Vendas</span><span>${r.vendas.length}</span></div>
      <div class="r-line"><span>Total vendido</span><span>${money(r.totalVendido)}</span></div>
      <div class="r-line"><span>Custos</span><span>${money(r.custos)}</span></div>
      <div class="r-line"><span>Recebido no mês</span><span>${money(r.recebido)}</span></div>
      <div class="r-line"><span>A vencer no mês</span><span>${money(r.aVencer)}</span></div>
      <div class="r-line"><span>Vencidas no mês</span><span style="color:var(--red)">${money(r.vencidas)}</span></div>
      <div class="r-total"><span>Lucro</span><span style="color:${r.lucro>=0?'var(--green)':'var(--red)'}">${money(r.lucro)}</span></div>
    </div>
    <div class="section-title">Vendas do mês</div>
    <div class="card">${linhas}</div>
    <button class="btn blue block mt" onclick="enviarRelatorioEmail('${ym}')">✉️ Enviar por e-mail</button>
    <button class="btn block mt-s" onclick="window.print()">🖨️ Imprimir / salvar PDF</button>
  `;
  openSheet('Relatório mensal', body);
}
function enviarRelatorioEmail(ym){
  const email = db.config.emailRelatorio || 'Matheus@msxinv.com.br';
  const r = relatorioMes(ym);
  const det = r.vendas.length
    ? r.vendas.map(v=>{ const c=clienteById(v.clienteId); return `• iPhone ${v.modelo||''} — ${c?c.nome:''}: ${money(v.valorTotal)} (lucro ${money(lucroVenda(v))})`; }).join('\n')
    : 'Nenhuma venda no mês.';
  const body =
`RELATÓRIO DE VENDAS — ${mesLabel(ym)}${db.config.vendedor?`\n${db.config.vendedor}`:''}

Vendas: ${r.vendas.length}
Total vendido: ${money(r.totalVendido)}
Custos: ${money(r.custos)}
Lucro: ${money(r.lucro)}
Recebido no mês: ${money(r.recebido)}
A vencer no mês: ${money(r.aVencer)}
Vencidas no mês: ${money(r.vencidas)}

Detalhe:
${det}`;
  window.open(`mailto:${email}?subject=${encodeURIComponent('Relatório de vendas — '+mesLabel(ym))}&body=${encodeURIComponent(body)}`);
}

function salvarConfig(){
  db.config = {
    vendedor:document.getElementById('gVend').value.trim(),
    telefone:document.getElementById('gTel').value.trim(),
    cidade:document.getElementById('gCidade').value.trim(),
    pixTipo:document.getElementById('gPixTipo').value,
    pixChave:document.getElementById('gPixChave').value.trim(),
    pixNome:document.getElementById('gPixNome').value.trim(),
    pixBanco:document.getElementById('gPixBanco').value.trim(),
    emailRelatorio:document.getElementById('gEmail').value.trim(),
    preco: db.config.preco
  };
  saveConfig(); closeSheet(); toast('Configurações salvas ✅');
}

async function trocarSenha(){
  const nova = document.getElementById('gSenha').value;
  if(!nova || nova.length<6){ toast('Senha muito curta (mín. 6)'); return; }
  try{
    const r = await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ password: nova }) });
    if(r.ok){ document.getElementById('gSenha').value=''; toast('Senha alterada ✅'); }
    else toast('Não consegui trocar a senha');
  }catch(e){ toast('Sem conexão'); }
}

async function exportar(){
  const recibos = {};
  for(const v of db.vendas){ const r = await Store.get('recibo_'+v.id); if(r) recibos[v.id]=r; }
  const data = { config:db.config, clientes:db.clientes, vendas:db.vendas, recibos, _exportado:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ivendas-backup-${todayISO()}.json`;
  a.click();
  toast('Backup baixado ✅');
}
function importar(inp){
  const f = inp.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(!confirm('Isso vai substituir seus dados atuais pelos do backup. Continuar?')) return;
      db.config = d.config||db.config; db.clientes = d.clientes||[]; db.vendas = d.vendas||[];
      await saveConfig(); await saveClientes(); await saveVendas();
      if(d.recibos){ for(const k in d.recibos){ await Store.set('recibo_'+k, d.recibos[k]); } }
      closeSheet(); go('inicio'); toast('Backup importado ✅');
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(f);
}

/* ============================ INIT / LOGIN ============================ */
let loginCodigoEnviado = false;
// modo 'senha' (padrão) ou 'codigo' (login por código enviado ao e-mail)
function showLogin(msg, modo){
  modo = modo || 'senha';
  if(modo==='senha') loginCodigoEnviado = false;
  document.body.classList.add('logged-out');
  const emailAtual = document.getElementById('loginEmail')?.value || 'matheus@msxinv.com.br';
  const msgHtml = msg?`<p class="center" style="color:var(--red);font-size:.85rem;margin-bottom:10px">${esc(msg)}</p>`:'';
  const emailField = `<div class="field"><label>E-mail</label><input id="loginEmail" type="email" value="${esc(emailAtual)}" autocomplete="username"></div>`;
  const corpo = modo==='senha'
    ? `<div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="sua senha"></div>
       ${msgHtml}
       <button class="btn blue block" id="loginBtn" onclick="fazerLogin()">Entrar</button>
       <button class="btn block mt-s" onclick="showLogin(null,'codigo')">Entrar com código por e-mail</button>`
    : `${msgHtml}
       ${loginCodigoEnviado
         ? `<div class="field"><label>Código recebido por e-mail</label><input id="loginCodigo" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
            <button class="btn blue block" id="loginBtn" onclick="confirmarCodigo()">Entrar</button>
            <button class="btn block mt-s" onclick="enviarCodigo()">Reenviar código</button>`
         : `<button class="btn blue block" id="loginBtn" onclick="enviarCodigo()">Enviar código por e-mail</button>`}
       <button class="btn block mt-s" onclick="showLogin(null,'senha')">Entrar com senha</button>`;
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand" style="justify-content:center;margin-bottom:6px"><span class="dot">📱</span> iVendas</div>
        <p class="center" style="color:var(--muted);margin-bottom:18px">Entre para acessar suas vendas</p>
        ${emailField}
        ${corpo}
      </div>
    </div>`;
  const p = document.getElementById('loginPass');
  if(p) p.addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });
  const c = document.getElementById('loginCodigo');
  if(c) c.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmarCodigo(); });
}
// Envia o código de 6 dígitos ao e-mail (só para contas já existentes: create_user:false)
async function enviarCodigo(){
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ showLogin('Digite seu e-mail','codigo'); return; }
  const btn = document.getElementById('loginBtn'); if(btn){ btn.textContent='Enviando...'; btn.disabled=true; }
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
      method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:email.toLowerCase(), create_user:false })
    });
    if(!r.ok){ showLogin('Não consegui enviar o código. Confira o e-mail.','codigo'); return; }
  }catch(e){ showLogin('Sem conexão','codigo'); return; }
  loginCodigoEnviado = true;
  showLogin('Código enviado. Confira sua caixa de entrada (e spam).','codigo');
}
async function confirmarCodigo(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const token = document.getElementById('loginCodigo').value.trim();
  if(!token){ showLogin('Digite o código','codigo'); return; }
  const btn = document.getElementById('loginBtn'); if(btn){ btn.textContent='Entrando...'; btn.disabled=true; }
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
      method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ type:'email', email, token })
    });
    if(!r.ok){ showLogin('Código inválido ou expirado','codigo'); return; }
    saveSession(await r.json());
    // entrou por código (recuperação): marca para exigir senha nova
    await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ data:{ must_change_password:true } }) });
  }catch(e){ showLogin('Sem conexão','codigo'); return; }
  loginCodigoEnviado = false;
  await bootApp();
}
async function fazerLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  if(!pass){ showLogin('Digite sua senha'); return; }
  const btn = document.getElementById('loginBtn'); if(btn){ btn.textContent='Entrando...'; btn.disabled=true; }
  const ok = await sbLogin(email, pass);
  if(!ok){ showLogin('E-mail ou senha incorretos'); return; }
  await bootApp();
}
async function bootApp(){
  const u = await sbUser();
  if(u && u.user_metadata && u.user_metadata.must_change_password){ showTrocarSenhaObrigatoria(); return; }
  document.body.classList.remove('logged-out');
  await load();
  go('inicio');
}
async function sbUser(){
  try{ const r = await sbFetch('/auth/v1/user'); return r.ok ? await r.json() : null; }catch(e){ return null; }
}
// primeiro acesso após recuperação: obriga definir senha nova antes de usar o app
function showTrocarSenhaObrigatoria(msg){
  document.body.classList.add('logged-out');
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand" style="justify-content:center;margin-bottom:6px"><span class="dot">📱</span> iVendas</div>
        <p class="center" style="color:var(--muted);margin-bottom:18px">Defina uma nova senha para continuar</p>
        <div class="field"><label>Nova senha (mín. 6 caracteres)</label><input id="novaSenha" type="password" autocomplete="new-password"></div>
        <div class="field"><label>Confirme a nova senha</label><input id="novaSenha2" type="password" autocomplete="new-password"></div>
        ${msg?`<p class="center" style="color:var(--red);font-size:.85rem;margin-bottom:10px">${esc(msg)}</p>`:''}
        <button class="btn blue block" id="loginBtn" onclick="salvarNovaSenhaObrigatoria()">Salvar nova senha</button>
        <button class="btn block mt-s" onclick="sair()">Sair</button>
      </div>
    </div>`;
}
async function salvarNovaSenhaObrigatoria(){
  const a = document.getElementById('novaSenha').value;
  const b = document.getElementById('novaSenha2').value;
  if(a.length<6){ showTrocarSenhaObrigatoria('Senha muito curta (mín. 6)'); return; }
  if(a!==b){ showTrocarSenhaObrigatoria('As senhas não conferem'); return; }
  const btn = document.getElementById('loginBtn'); if(btn){ btn.textContent='Salvando...'; btn.disabled=true; }
  try{
    const r = await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ password:a, data:{ must_change_password:false } }) });
    if(!r.ok){ showTrocarSenhaObrigatoria('Não consegui salvar a senha'); return; }
  }catch(e){ showTrocarSenhaObrigatoria('Sem conexão'); return; }
  await bootApp();
}
async function sair(){
  clearSession(); closeSheet(); showLogin();
}

(async ()=>{
  loadSession();
  if(session && session.expires_at && session.expires_at < Date.now()+60000){ await sbRefresh(); }
  if(session){ await bootApp(); } else { showLogin(); }
})();
</script>
